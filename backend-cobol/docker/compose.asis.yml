# ============================================================
#  ASIS デモ  compose 조각
#   서비스: asis-backend(CGI/nginx) + oracle(Free 23ai, 1521)
#   실행(리포지토리 루트에서):
#     docker compose -f backend-cobol/docker/compose.asis.yml up -d --build
#   VM 재부팅 시 자동 복구: restart: unless-stopped
# ============================================================
name: minibank-cobol
services:
  oracle:
    # ★ JA16SJIS(Shift-JIS) 오라클.
    #   무료 오라클 컨테이너(gvenzl 등)는 프리빌드 DB가 AL32UTF8로 고정돼
    #   ORACLE_CHARACTERSET를 무시한다. 그래서 정식 이미지를 빌드 타임에
    #   dbca 로 JA16SJIS DB로 재생성하고 스키마+시드까지 구워 넣은
    #   커스텀 이미지(Dockerfile.oracle-sjis)를 사용한다.
    #   최초 빌드 ~10분(이미지 ~18GB), 이후는 캐시 재사용.
    build:
      context: ../..                    # 리포지토리 루트
      dockerfile: backend-cobol/docker/Dockerfile.oracle-sjis
    image: mb-oracle-sjis:latest
    container_name: mb-oracle
    environment:
      ORACLE_PWD: oracle                # SYS/SYSTEM/PDBADMIN 비밀번호(정식 이미지 변수)
    ports:
      - "1521:1521"
    healthcheck:
      # 앱 계정으로 실제 접속돼야 정상(=FREEPDB1 자동오픈 + 스키마 존재)
      test: ["CMD-SHELL", "echo 'select 1 from dual;' | \"$$ORACLE_HOME/bin/sqlplus\" -s -L minibank/minibank@//localhost:1521/FREEPDB1 | grep -q 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 180s
    restart: unless-stopped

  asis-backend:
    build:
      context: ../..                    # 리포지토리 루트
      dockerfile: backend-cobol/docker/Dockerfile.asis
    container_name: mb-asis-backend
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      ORA_CONN: "oracle://oracle:1521/FREEPDB1"
      ORA_USER: "minibank"
      ORA_PASS: "minibank"
      # DB는 JA16SJIS 저장. GixSQL 드라이버가 취득 시 UTF-8로 강제 변환하므로
      # (NLS_LANG 실질 무시) 응답은 UTF-8. 프론트도 UTF-8.
      NLS_LANG: "AMERICAN_AMERICA.AL32UTF8"
    ports:
      - "8080:80"
    restart: unless-stopped
