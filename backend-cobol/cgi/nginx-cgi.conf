# ============================================================
#  nginx  ->  CGI(GnuCOBOL 実行体) ルーティング
#  nginx 単体は CGI を実行できないため fcgiwrap 経由(古典 Web パターン)。
#  静的フロントは / から配信、業務APIは /api/<name> -> bin/<name>.cgi。
#  応答は UTF-8 JSON(各 CGI が Content-Type を出力)。
#  DB接続情報(ORA_CONN/ORA_USER/ORA_PASS)は fcgiwrap プロセスの環境から
#  CGI へ継承させる(entrypoint.sh で export)。
# ============================================================
server {
    listen 80;
    server_name _;

    root /app/frontend;
    index index.html;

    # ---- フロントエンド(無変更再利用) ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 業務API(オンライン5種 + 拡張) ----
    #   例: /api/zandaka?kouza=1000000002
    location ~ ^/api/(?<cginame>[a-z]+)$ {
        if ($cginame !~ ^(zandaka|furikomi|meisai|login|signup|loan|repay|notice|holdings)$) {
            return 404;
        }
        include        fastcgi_params;
        fastcgi_pass   unix:/run/fcgiwrap.sock;
        fastcgi_param  SCRIPT_FILENAME /app/build/bin/$cginame.cgi;
        fastcgi_param  DOCUMENT_ROOT   /app/build/bin;
    }
}
