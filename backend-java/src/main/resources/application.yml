server:
  port: 8080

spring:
  application:
    name: minibank-backend
  datasource:
    # 로컬 기본 5433 (호스트 네이티브 PG 5432와 충돌 회피). compose 내부는 postgres:5432.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/minibank}
    username: ${DB_USER:minibank}
    password: ${DB_PASS:minibank}
    driver-class-name: org.postgresql.Driver
  # 응답 JSON은 UTF-8 (프론트 계약)
  jackson:
    default-property-inclusion: non_null

# 참고: 이 백엔드는 신규 PostgreSQL 에 붙는다. 기존 COBOL 백엔드의 Oracle 은 건드리지 않는다.
