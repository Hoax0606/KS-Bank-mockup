server:
  port: 8080
  # 폼 파라미터(일본어) 요청/응답을 UTF-8로 강제 (서블릿 기본 ISO-8859-1 방지)
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: minibank-backend
  datasource:
    # 로컬 기본 5433 (호스트 네이티브 PG 5432와 충돌 회피). compose 내부는 postgres:5432.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/minibank}
    username: ${DB_USER:minibank}
    password: ${DB_PASS:minibank}
    driver-class-name: org.postgresql.Driver
  # 응답 JSON은 UTF-8 (프론트 계약)
  jackson:
    default-property-inclusion: non_null

app:
  batch:
    # 야간배치 帳票 7종 출력 위치. COBOL 의 /app/build/data 에 대응.
    # 컨테이너에서는 WORKDIR=/app 이므로 /app/data (compose 에서 호스트로 마운트).
    output-dir: ${BATCH_OUT_DIR:./data}

# 참고: 이 백엔드는 신규 PostgreSQL 에 붙는다. 기존 COBOL 백엔드의 Oracle 은 건드리지 않는다.
