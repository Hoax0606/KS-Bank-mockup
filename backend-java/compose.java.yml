# ============================================================
#  Java 백엔드 스택 (신규 PostgreSQL + Spring Boot 앱)
#  ※ 기존 COBOL 백엔드/Oracle 과 독립. 포트도 겹치지 않게 분리.
#  실행(★리포지토리 루트에서 — COBOL과 동일한 방식★):
#     docker compose -f backend-java/compose.java.yml up -d --build
#     -> http://localhost:8081/
# ============================================================
name: minibank-java
services:
  postgres:
    image: postgres:16
    container_name: mbj-postgres
    environment:
      POSTGRES_DB: minibank
      POSTGRES_USER: minibank
      POSTGRES_PASSWORD: minibank
    ports:
      # ★SERVER-SETUP.md §3-2 와 동일하게 5434 로 공개★
      #   (서버의 5433 은 다른 프로젝트용 'postgres'/bank_postgres 이므로 겹치면 안 되고,
      #    호스트 네이티브 PostgreSQL 5432 와도 충돌하지 않는다)
      - "5434:5432"
    volumes:
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./src/main/resources/db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minibank"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: mbj-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/minibank
      DB_USER: minibank
      DB_PASS: minibank
      # COBOL 컨테이너(Dockerfile.asis)가 TZ=Asia/Tokyo 이므로 맞춘다.
      # 안 맞추면 온라인 거래의 TORIHIKI_DT 가 양쪽에서 9시간 벌어진다.
      TZ: Asia/Tokyo
    ports:
      - "8081:8080"
    volumes:
      # 야간배치 帳票 7종 산출물(app.batch.output-dir=./data → /app/data)
      - ./data:/app/data
    restart: unless-stopped
